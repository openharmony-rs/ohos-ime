[project]
name = "ohos-test-ime"
version = "0.1.0.dev0"
description = "Host-side client for a scriptable OpenHarmony input method, for on-device tests"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["hdc-py>=0.2.1,<0.3"]

[project.urls]
Repository = "https://github.com/openharmony-rs/ohos-ime"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
